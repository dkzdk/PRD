<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#06162b;

}

/* HEADER */

header{
padding:30px 20px;
background:#102544;
border-bottom:1px solid #1f4d8f;
text-align:center;
font-size:24px;
font-weight:bold;
color:#ffd500;
}

/* LOGO */

.logo{
width:170px;
margin-bottom:15px;
filter:drop-shadow(0 0 10px #000);
}

/* CONTAINER */

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

/* CARD */

.card{
background:#102544;
padding:20px;
border-radius:16px;
border:1px solid #2d5fa8;
margin-bottom:20px;
box-shadow:0 0 20px #00000050;
}

.card h2{
margin-bottom:15px;
color:#ffffff;
}

/* INPUTS */

input,
textarea,
select{

width:100%;
padding:12px;
margin-top:10px;
background:#0b2342;
border:1px solid #2d5fa8;
border-radius:10px;
color:white;
font-size:15px;

}

/* BUTTON */

button{

width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#ffd500,#2d7dff);
color:white;
font-weight:bold;
cursor:pointer;
font-size:15px;
transition:0.2s;

}

button:hover{
opacity:0.9;
transform:scale(1.01);
}

/* CRIMES */

.crime{

padding:12px;
background:#0b2342;
border:1px solid #2d5fa8;
border-radius:10px;
margin-top:10px;

}

/* RESULTADO */

.resultado{

margin-top:15px;
padding:15px;
background:#0b2342;
border-radius:10px;
line-height:1.8;
border:1px solid #2d5fa8;

}

/* RANGE */

.range-box{

margin-top:15px;
padding:15px;
background:#0b2342;
border-radius:10px;
border:1px solid #2d5fa8;

}

input[type="range"]{
accent-color:#ffd500;
}

/* TOTAL */

.total-box{

margin-top:15px;
padding:15px;
background:#0d2f5c;
border:1px solid #ffd500;
border-radius:10px;
line-height:2;
font-size:16px;

}

/* UPLOAD */

.upload-box{

margin-top:15px;
padding:15px;
background:#0b2342;
border-radius:10px;
border:1px solid #2d5fa8;

}

</style>

</head>

<!-- REDUÇÃO -->

<label>
📉 REDUÇÃO DE PENA
</label>

<input
type="range"
id="reducao"
min="0"
max="50"
value="0"
oninput="atualizarReducao()"
>

<div style="margin-top:10px;">

Redução aplicada:
<b id="valorReducao">0%</b>

</div>

</div>

<!-- TOTAL -->

<div class="total-box">

⏳ Pena Total:
<b id="penaTotal">0 meses</b>

<br>

✅ Pena Final:
<b id="penaFinal">0 meses</b>

</div>

<button onclick="registrarPRD()">
⚖️ FINALIZAR BOLETIM PRD
</button>

<div class="resultado" id="resultado">

Nenhum boletim registrado.

</div>

</div>

<script>

/* WEBHOOK */

const webhookURL =
"https://discord.com/api/webhooks/1502028378448986275/OO2GQ4kw5n_rF9EJrwKk0jKUjUkFkYl1aKB3gXabXK9MJnh1CmxFdHFFOtMrhvT_fFZ-";

/* SISTEMA */

let crimes = [];

/* ADICIONAR CRIME */

function adicionarCrime(){

let crime =
document.getElementById("crime").value;

crimes.push(crime);

renderCrimes();

calcularPena();

}

/* RENDERIZAR */

function renderCrimes(){

let html = "";

crimes.forEach((crime,index)=>{

html += `
<div class="crime">

${crime}

</div>
`;

});

listaCrimes.innerHTML = html;

}

/* REDUÇÃO */

function atualizarReducao(){

valorReducao.innerText =
document.getElementById("reducao").value + "%";

calcularPena();

}

/* CALCULAR PENA */

function calcularPena(){

let totalMeses = 0;

crimes.forEach(crime=>{

let match =
crime.match(/(\d+)\s*meses/i);

if(match){

totalMeses += parseInt(match[1]);

}

});

let reducao =
parseInt(document.getElementById("reducao").value);

let mesesFinal =
totalMeses - (totalMeses * reducao / 100);

mesesFinal = Math.floor(mesesFinal);

penaTotal.innerText =
totalMeses + " meses";

penaFinal.innerText =
mesesFinal + " meses";

}

/* REGISTRAR */

function registrarPRD(){

let oficialNome =
document.getElementById("oficialNome").value;

let oficialId =
document.getElementById("oficialId").value;

let suspeitoNome =
document.getElementById("suspeitoNome").value;

let suspeitoId =
document.getElementById("suspeitoId").value;

let descricao =
document.getElementById("descricao").value;

let reducao =
parseInt(document.getElementById("reducao").value);

if(crimes.length <= 0){

alert("Adicione pelo menos 1 crime.");

return;

}

/* TOTAL */

let totalMeses = 0;

crimes.forEach(crime=>{

let match =
crime.match(/(\d+)\s*meses/i);

if(match){

totalMeses += parseInt(match[1]);

}

});

let mesesFinal =
totalMeses - (totalMeses * reducao / 100);

mesesFinal = Math.floor(mesesFinal);

/* ARQUIVOS */

let arquivos =
document.getElementById("arquivos").files;

let nomesArquivos = [];

for(let i = 0; i < arquivos.length; i++){

nomesArquivos.push(arquivos[i].name);

}

/* TEXTO */

let texto = `

👮 OFICIAL:
${oficialNome} (${oficialId})

👤 SUSPEITO:
${suspeitoNome} (${suspeitoId})

⚖️ CRIMES:
${crimes.join(", ")}

⏳ PENA TOTAL:
${totalMeses} meses

📉 REDUÇÃO:
${reducao}%

✅ PENA FINAL:
${mesesFinal} meses

📂 ARQUIVOS:
${nomesArquivos.join(", ") || "Nenhum"}

📝 DESCRIÇÃO:
${descricao}

`;

/* WEBHOOK */

fetch(webhookURL,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username:"PRD VOID RP",

embeds:[{

title:"⚖️ NOVO BOLETIM PRD",

description:"```" + texto + "```",

color:16766720

}]

})

})

.then(()=>{

resultado.innerHTML = `

<b>✅ BOLETIM ENVIADO COM SUCESSO</b>

<hr style="margin:10px 0;">

<b>⏳ Pena Total:</b>
${totalMeses} meses

<br>

<b>📉 Redução:</b>
${reducao}%

<br>

<b>✅ Pena Final:</b>
${mesesFinal} meses

<br><br>

<b>📂 Arquivos:</b>
${nomesArquivos.join(", ") || "Nenhum"}

<hr style="margin:10px 0;">

${texto.replace(/\n/g,"<br>")}

`;

crimes = [];

renderCrimes();

calcularPena();

})

.catch(()=>{

alert("Erro ao enviar webhook.");

});

}

</script>

</body>
